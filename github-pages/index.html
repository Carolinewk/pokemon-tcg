<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Play Pokémon TCG with friends, build your own decks, and explore 20,444 English cards."
    />
    <title>PokéTable — Pokémon TCG with friends</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <script>
      try {
        const saved = localStorage.getItem("poketable-theme");
        const dark =
          saved === "dark" ||
          (saved !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
